[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moveo-fintech-tools"
version = "0.1.0"
description = "Moveo Fintech Tools CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "questionary>=2.0",
  "PyYAML>=6.0",
]

[project.scripts]
moveo-fintech = "mft.cli:app"

[tool.setuptools.packages.find]
include = ["mft*"]
